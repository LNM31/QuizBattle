spring.application.name=quiz-battle

spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:quizbattle}
spring.datasource.username=${POSTGRES_USER:quizbattle}
spring.datasource.password=${POSTGRES_PASSWORD:quizbattle}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# just for a warning to disappear
spring.jpa.open-in-view=false

# T19 — PDF upload limits (Spring default is 1MB). Request slightly above file size for form overhead.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB